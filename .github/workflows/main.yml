name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  win:
    name: "Windows Build"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        id: build_project
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config RelWithDebInfo

      - name: Collect outputs
        shell: pwsh
        run: |
          mkdir _output
          Copy-Item -Recurse build/bin/* _output
          Get-ChildItem -Recurse _output | Select-Object FullName, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: output_win
          path: _output
